[package]
name = "sample_extension"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Threading for WASM is configured across several layers — see the
# "Threading" section of the project README for the full picture. In short:
#   • Default WASM build is THREADED (uses -pthread / +atomics).
#   • Enabling this feature switches to a single-threaded build, paired with
#     gdext's experimental-wasm-nothreads. Used for environments without
#     SharedArrayBuffer / COOP+COEP cross-origin isolation.
# The xtask `cargo xtask build --web --nothreads` flag activates this.
nothreads = ["godot/experimental-wasm-nothreads"]

# Native desktop builds: prebuilt API for the godot crate's pinned version.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
godot.workspace = true

# WASM builds: api-custom regenerates bindings against the local Godot binary,
# experimental-wasm enables wasm support, lazy-function-tables works around
# wasm-ld limits with large extension surfaces.
[target.'cfg(target_family = "wasm")'.dependencies]
godot = { version = "0.5.1", features = ["api-custom", "experimental-wasm", "lazy-function-tables"] }

[lints.rust]
unsafe_code = "allow"  # Required for #[gdextension] FFI

[lints.clippy]
all = "deny"
pedantic = "warn"
