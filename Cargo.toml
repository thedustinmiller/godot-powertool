[workspace]
members = [
    "common",
    "xtask",
    "mcp",
    "godot_docs",
    "lsp-bridge",
    # Uncomment to enable the optional Rust GDExtension. After uncommenting,
    # run `cargo xtask build` and enable "Sample Rust Extension" in
    # Project Settings → Plugins. See README.md for full instructions.
     "addons/sample_extension/rust",
]
# The xtask copy_addons step duplicates `addons/sample_extension/` into
# `godot/addons/sample_extension/` for Godot to load. The copy contains a
# `rust/Cargo.toml` we don't want cargo to treat as a workspace member.
exclude = ["godot/addons/sample_extension/rust"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
# Internal
powertool-common = { path = "common" }

# Godot GDExtension
godot = "0.5.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging / tracing
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"

# Async
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

# MCP
rmcp = { version = "1", features = ["server", "transport-io"] }

# XML / doc generation
quick-xml = "0.37"
regex = "1"
walkdir = "2"

# Networking / downloads
ureq = "3"

# Archive handling
zip = "2.2"
tar = "0.4"
flate2 = "1.0"

# CLI UX
indicatif = "0.17"

# Platform utilities
which = "7.0"
dirs-next = "2.0"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 1
debug = true
